name: FinPay Analytics CI

on:
  push:
    branches:
      - main
      - feature/production-upgrade

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finpay_test
          POSTGRES_USER: finpay_user
          POSTGRES_PASSWORD: finpay_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpay_user -d finpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: finpay_test
      DB_USER: finpay_user
      DB_PASSWORD: finpay_test_password
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      TEST_USERNAME: ci_admin
      TEST_PASSWORD: ci_admin_password_123
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: ci_admin_password_123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load database schema
        run: |
          grep -v -E '^(\\restrict|\\unrestrict|SET transaction_timeout)' db/schema.sql > db/schema_ci.sql
          PGPASSWORD="$DB_PASSWORD" psql -h localhost -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 -f db/schema_ci.sql

      - name: Create CI admin user
        run: python src/create_admin.py

      - name: Run tests
        run: python -m pytest -v
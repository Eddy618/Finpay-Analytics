name: FinPay Analytics CI

on:
  push:
    branches:
      - main
      - feature/production-upgrade

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finpay_test
          POSTGRES_USER: finpay_user
          POSTGRES_PASSWORD: finpay_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpay_user -d finpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: finpay_test
      DB_USER: finpay_user
      DB_PASSWORD: finpay_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load database schema
        if: ${{ hashFiles('db/schema.sql') != '' }}
        run: |
          PGPASSWORD=finpay_test_password psql -h localhost -U finpay_user -d finpay_test -f db/schema.sql

      - name: Run tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          JWT_EXPIRE_MINUTES: ${{ secrets.JWT_EXPIRE_MINUTES }}
        run: |
          python -m pytest -v
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finpay-api
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: finpay-streamlit
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api